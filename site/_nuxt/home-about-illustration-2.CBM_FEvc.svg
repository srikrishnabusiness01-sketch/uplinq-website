<svg width="190" height="226" viewBox="0 0 190 226" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Target Center Point at cx="95", cy="113" -->
  <!-- Outer Ring -->
  <circle cx="95" cy="113" r="76" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
  <!-- Second Ring -->
  <circle cx="95" cy="113" r="54" fill="#FFFFFF" stroke="#202020" stroke-width="2.2"/>
  <!-- Third Ring -->
  <circle cx="95" cy="113" r="32" fill="#E6EFED" stroke="#202020" stroke-width="2.2"/>
  <!-- Bullseye Center in Lime -->
  <circle cx="95" cy="113" r="14" fill="#A9DC1E" stroke="#202020" stroke-width="2.2"/>

  <!-- Crosshairs -->
  <line x1="95" y1="25" x2="95" y2="201" stroke="#202020" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.6"/>
  <line x1="7" y1="113" x2="183" y2="113" stroke="#202020" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Precision Arrow hitting dead center from upper-right at angle -->
  <!-- Arrow Shaft -->
  <line x1="165" y1="43" x2="98" y2="110" stroke="#202020" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Arrow Head embedded in center -->
  <polygon points="95,113 110,105 103,120" fill="#202020"/>
  
  <!-- Feathers / Fletching at top-right end -->
  <polygon points="165,43 175,25 158,35" fill="#A9DC1E" stroke="#202020" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="165,43 178,52 168,60" fill="#A9DC1E" stroke="#202020" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Impact Rings / Ripples radiating from bullseye -->
  <path d="M82 100C86 96 92 94 98 96" stroke="#202020" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M78 126C82 130 90 131 96 128" stroke="#202020" stroke-width="1.8" stroke-linecap="round"/>
</svg>
