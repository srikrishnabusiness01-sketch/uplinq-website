<svg width="252" height="250" viewBox="0 0 252 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Channel 1: Email Icon (Top Left) -->
  <g transform="translate(32, 22)">
    <rect x="0" y="0" width="44" height="30" rx="5" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <path d="M2 3L22 18L42 3" stroke="#202020" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Line connecting Email to funnel -->
  <path d="M54 55V82C54 90 68 96 82 102" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Channel 2: LinkedIn Icon (Top Center) -->
  <g transform="translate(104, 18)">
    <rect x="0" y="0" width="44" height="34" rx="7" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <!-- 'in' badge -->
    <circle cx="14" cy="12" r="2.5" fill="#202020"/>
    <line x1="14" y1="17" x2="14" y2="26" stroke="#202020" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 26V20C22 18 24 16.5 27 16.5C30 16.5 31.5 18 31.5 20.5V26" stroke="#202020" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Line connecting LinkedIn to funnel -->
  <path d="M126 55V96" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>

  <!-- Channel 3: WhatsApp/Chat Icon (Top Right) -->
  <g transform="translate(176, 22)">
    <path d="M22 2C10.5 2 1.5 10 1.5 20C1.5 23.5 2.7 26.8 4.8 29.5L2 37L10 34.5C13.5 36.5 17.5 37.5 22 37.5C33.5 37.5 42.5 29.5 42.5 20C42.5 10 33.5 2 22 2Z" fill="#F2F7F6" stroke="#202020" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M14 18C15 21 18 23 21 24C22.5 24.5 24 24 25 23" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- Line connecting WhatsApp to funnel -->
  <path d="M198 62V82C198 90 184 96 170 102" stroke="#202020" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>

