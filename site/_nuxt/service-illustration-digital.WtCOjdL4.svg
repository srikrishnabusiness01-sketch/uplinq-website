  <!-- Funnel Neck Highlight -->
  <rect x="102" y="174" width="48" height="28" fill="#A9DC1E" fill-opacity="0.3"/>
  
  <!-- Flow lines inside funnel -->
  <path d="M80 114L114 158" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  <path d="M126 114V164" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  <path d="M172 114L138 158" stroke="#202020" stroke-width="2" stroke-linecap="round"/>

  <!-- Qualified Lead Node (Bottom Output) -->
  <g transform="translate(126, 228)">
    <circle cx="0" cy="0" r="14" fill="#A9DC1E" stroke="#202020" stroke-width="2.5"/>
    <!-- Checkmark inside lead badge -->
    <path d="M-5 0L-1 4L6 -4" stroke="#202020" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
