<svg width="238" height="250" viewBox="0 0 238 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular workflow path connecting 4 nodes -->
  <path d="M119 50C160 50 194 84 194 125C194 166 160 200 119 200C78 200 44 166 44 125C44 84 78 50 119 50Z" stroke="#202020" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Directional arrowheads on cycle -->
  <polygon points="166,62 154,52 158,68" fill="#202020"/>
  <polygon points="182,166 192,154 176,158" fill="#202020"/>
  <polygon points="72,188 84,198 80,182" fill="#202020"/>
  <polygon points="56,84 46,96 62,92" fill="#202020"/>

  <!-- Node 1: Top (Input / Ingestion) -->
  <g transform="translate(119, 50)">
    <circle cx="0" cy="0" r="20" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#202020"/>
  </g>

  <!-- Node 2: Right (Qualification / Scoring) -->
  <g transform="translate(194, 125)">
    <circle cx="0" cy="0" r="20" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#A9DC1E" stroke="#202020" stroke-width="1.8"/>
  </g>

  <!-- Node 3: Bottom (Execution / CRM Flow) -->
  <g transform="translate(119, 200)">
    <circle cx="0" cy="0" r="20" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <path d="M-6 -6H6V6H-6Z" fill="#202020"/>
  </g>

  <!-- Node 4: Left (Feedback / Optimization) -->
  <g transform="translate(44, 125)">
    <circle cx="0" cy="0" r="20" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <polygon points="0,-9 8,7 -8,7" fill="#A9DC1E" stroke="#202020" stroke-width="1.8"/>
  </g>

  <!-- Center Hub: AI Automation Lightning Bolt -->
  <circle cx="119" cy="125" r="28" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
  <polygon points="122,106 109,124 118,124 116,144 129,126 120,126" fill="#A9DC1E" stroke="#202020" stroke-width="2" stroke-linejoin="round"/>
</svg>
