<svg width="205" height="222" viewBox="0 0 205 222" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isometric Open Box Base -->
  <!-- Left Side -->
  <polygon points="45,145 102,178 102,212 45,178" fill="#F2F7F6" stroke="#202020" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right Side -->
  <polygon points="102,178 160,145 160,178 102,212" fill="#E6EFED" stroke="#202020" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Opened Flaps -->
  <!-- Left Flap open downward-out -->
  <polygon points="45,145 102,178 85,192 28,158" fill="#F2F7F6" stroke="#202020" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Right Flap open downward-out -->
  <polygon points="102,178 160,145 178,158 120,192" fill="#E6EFED" stroke="#202020" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Back Left Flap tilted up -->
  <polygon points="45,145 102,112 95,85 38,118" fill="#FFFFFF" stroke="#202020" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Back Right Flap tilted up -->
  <polygon points="102,112 160,145 168,118 110,85" fill="#FFFFFF" stroke="#202020" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Geometric shapes floating / spilling upward out of the box -->
  <!-- Shape 1: Isometric cube in Lime green -->
  <g transform="translate(75, 55)">
    <polygon points="20,0 40,11 20,22 0,11" fill="#A9DC1E" stroke="#202020" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="0,11 20,22 20,44 0,33" fill="#88B815" stroke="#202020" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="20,22 40,11 40,33 20,44" fill="#6E960F" stroke="#202020" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Shape 2: Floating 4-pointed sparkle / star -->
  <path d="M42 45C42 55 35 60 25 60C35 60 42 65 42 75C42 65 49 60 59 60C49 60 42 55 42 45Z" fill="#F2F7F6" stroke="#202020" stroke-width="2" stroke-linejoin="round"/>

  <!-- Shape 3: Geometric diamond prism on the right -->
  <polygon points="152,42 168,66 152,90 136,66" fill="#A9DC1E" fill-opacity="0.5" stroke="#202020" stroke-width="2" stroke-linejoin="round"/>

  <!-- Shape 4: Floating sphere -->
  <circle cx="120" cy="35" r="14" fill="#F2F7F6" stroke="#202020" stroke-width="2.2"/>
  <path d="M112 30C116 28 124 28 128 32" stroke="#202020" stroke-width="2" stroke-linecap="round"/>

  <!-- Light energy trails -->
  <path d="M70 120Q60 90 75 75" stroke="#202020" stroke-width="1.8" stroke-dasharray="3 3"/>
  <path d="M130 120Q145 90 135 65" stroke="#202020" stroke-width="1.8" stroke-dasharray="3 3"/>
  <path d="M102 125V80" stroke="#202020" stroke-width="1.8" stroke-dasharray="3 3"/>
</svg>
