<svg width="240" height="224" viewBox="0 0 240 224" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Input Node 1: E (Email) -->
  <g transform="translate(36, 45)">
    <circle cx="0" cy="0" r="18" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <text x="0" y="6" font-family="PolySans, sans-serif" font-weight="700" font-size="14" fill="#202020" text-anchor="middle">E</text>
  </g>
  <!-- Track 1 connecting to pipeline junction -->
  <path d="M54 45H105C118 45 125 65 125 80" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Input Node 2: L (LinkedIn) -->
  <g transform="translate(36, 112)">
    <circle cx="0" cy="0" r="18" fill="#A9DC1E" stroke="#202020" stroke-width="2.5"/>
    <text x="0" y="6" font-family="PolySans, sans-serif" font-weight="700" font-size="14" fill="#202020" text-anchor="middle">L</text>
  </g>
  <!-- Track 2 straight to pipeline junction -->
  <path d="M54 112H125" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Input Node 3: W (WhatsApp) -->
  <g transform="translate(36, 179)">
    <circle cx="0" cy="0" r="18" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <text x="0" y="6" font-family="PolySans, sans-serif" font-weight="700" font-size="14" fill="#202020" text-anchor="middle">W</text>
  </g>
  <!-- Track 3 connecting to pipeline junction -->
  <path d="M54 179H105C118 179 125 159 125 144" stroke="#202020" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Pipeline Central Automation Hub (Gear / Processor) -->
  <g transform="translate(125, 112)">
    <rect x="-14" y="-24" width="28" height="48" rx="6" fill="#F2F7F6" stroke="#202020" stroke-width="2.5"/>
    <!-- Flow arrow inside hub -->
    <path d="M-6 -6L3 0L-6 6" stroke="#202020" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1 0H-7" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Flow line from Hub to CRM -->
  <line x1="139" y1="112" x2="175" y2="112" stroke="#202020" stroke-width="2.8" stroke-linecap="round"/>
  <polygon points="178,112 168,106 168,118" fill="#202020"/>

  <!-- CRM Database Cylinder Icon (Right Side) -->
  <g transform="translate(178, 80)">
    <!-- Top Cylinder -->
    <path d="M0 12C0 5.4 10.7 0 24 0C37.3 0 48 5.4 48 12C48 18.6 37.3 24 24 24C10.7 24 0 18.6 0 12Z" fill="#A9DC1E" stroke="#202020" stroke-width="2.2"/>
    <!-- Middle Cylinder Body -->
    <path d="M0 12V36C0 42.6 10.7 48 24 48C37.3 48 48 42.6 48 36V12" fill="#F2F7F6" stroke="#202020" stroke-width="2.2"/>
    <!-- Bottom Cylinder Body -->
    <path d="M0 36V60C0 66.6 10.7 72 24 72C37.3 72 48 66.6 48 60V36" fill="#E6EFED" stroke="#202020" stroke-width="2.2"/>
    <!-- Dividing Ring Lines -->
    <path d="M0 36C0 42.6 10.7 48 24 48C37.3 48 48 42.6 48 36" stroke="#202020" stroke-width="2.2"/>
    <!-- "CRM" label -->
    <text x="24" y="42" font-family="PolySans, sans-serif" font-weight="700" font-size="10" fill="#202020" text-anchor="middle" letter-spacing="0.5">CRM</text>
  </g>
</svg>
