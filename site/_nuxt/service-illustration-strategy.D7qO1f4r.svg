<svg width="250" height="250" viewBox="0 0 250 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer subtle dashed compass ring -->
  <circle cx="125" cy="125" r="85" stroke="#202020" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.6"/>
  <!-- Inner precision circle -->
  <circle cx="125" cy="125" r="55" stroke="#202020" stroke-width="2"/>
  
  <!-- Subtle tick marks at cardinal points -->
  <line x1="125" y1="32" x2="125" y2="44" stroke="#202020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="125" y1="206" x2="125" y2="218" stroke="#202020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="125" x2="44" y2="125" stroke="#202020" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="206" y1="125" x2="218" y2="125" stroke="#202020" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Secondary 45 degree ticks -->
  <line x1="59" y1="59" x2="68" y2="68" stroke="#202020" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="191" y1="191" x2="182" y2="182" stroke="#202020" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="59" y1="191" x2="68" y2="182" stroke="#202020" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Four-point star base in dark fill -->
  <polygon points="125,75 133,117 175,125 133,133 125,175 117,133 75,125 117,117" fill="#F2F7F6" stroke="#202020" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Prominent directional pointer extending BEYOND circle towards North-East (strategic direction) -->
  <path d="M112 138L125 125L210 40" stroke="#202020" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Arrowhead extending cleanly outward -->
  <polygon points="215,35 178,42 198,62" fill="#202020" stroke="#202020" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="215,35 190,44 198,62" fill="#A9DC1E"/>
  
  <!-- Center pivot ring -->
  <circle cx="125" cy="125" r="9" fill="#202020"/>
  <circle cx="125" cy="125" r="4" fill="#FFFFFF"/>
</svg>
