<svg width="260" height="223" viewBox="0 0 260 223" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Horizontal Baseline with tick marks (representing standard market performance) -->
  <!-- Left Segment of baseline -->
  <line x1="24" y1="145" x2="115" y2="145" stroke="#202020" stroke-width="3" stroke-linecap="round"/>
  <!-- Gap where arrow breaks through: from x=115 to x=155 -->
  <!-- Shattered breakthrough fragments around the breach -->
  <polygon points="120,138 126,134 124,142" fill="#202020"/>
  <polygon points="145,150 152,154 148,146" fill="#202020"/>
  <polygon points="132,152 136,158 130,156" fill="#A9DC1E"/>
  <!-- Right Segment of baseline (dotted to show superseded standard) -->
  <line x1="155" y1="145" x2="236" y2="145" stroke="#202020" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round" opacity="0.5"/>

  <!-- Subtle vertical tick marks along baseline -->
  <line x1="45" y1="145" x2="45" y2="155" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="145" x2="75" y2="155" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  <line x1="105" y1="145" x2="105" y2="155" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  <line x1="175" y1="145" x2="175" y2="155" stroke="#202020" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="205" y1="145" x2="205" y2="155" stroke="#202020" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Dynamic Diagonal Arrow surging upward through the baseline -->
  <!-- Trailing speed/acceleration lines below arrow -->
  <line x1="40" y1="195" x2="80" y2="172" stroke="#A9DC1E" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="205" x2="85" y2="188" stroke="#202020" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Main Rising Parabolic Curve / Arrow Shaft -->
  <path d="M48 185C95 180 120 155 210 52" stroke="#202020" stroke-width="5" stroke-linecap="round"/>
  <!-- Accent highlight spine on arrow shaft -->
  <path d="M60 183C98 178 122 154 204 59" stroke="#A9DC1E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bold Triangular Arrowhead pointing top-right into high growth -->
  <polygon points="228,32 186,45 204,68" fill="#202020" stroke="#202020" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="228,32 198,48 204,68" fill="#A9DC1E"/>

  <!-- Spark of expansion / breakthrough at the arrow tip -->
  <circle cx="236" cy="24" r="3" fill="#A9DC1E"/>
  <line x1="236" y1="14" x2="236" y2="18" stroke="#A9DC1E" stroke-width="2" stroke-linecap="round"/>
  <line x1="244" y1="20" x2="240" y2="22" stroke="#A9DC1E" stroke-width="2" stroke-linecap="round"/>
  <line x1="246" y1="28" x2="242" y2="27" stroke="#A9DC1E" stroke-width="2" stroke-linecap="round"/>
</svg>
