events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Additional MIME types for modern web typography & media
    types {
        font/ttf                      ttf;
        font/otf                      otf;
        font/woff                     woff;
        font/woff2                    woff2;
        image/svg+xml                 svg svgz;
        image/webp                    webp;
        video/mp4                     mp4;
        video/webm                    webm;
    }

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Enable byte-range requests for videos
        location ~* \.(mp4|webm)$ {
            mp4;
            mp4_buffer_size     1m;
            mp4_max_buffer_size 10m;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Fallback for dynamic Nuxt CSS preloads
        location ~* ^/_nuxt/.*\.css$ {
            expires 1y;
            add_header Content-Type "text/css; charset=utf-8";
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri /_nuxt/default.-CLknPkJ.css;
        }

        # Cache static assets
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Clean URLs and routing
        location / {
            try_files $uri $uri/ $uri/index.html /index.html;
        }

        error_page 404 /index.html;
    }
}
